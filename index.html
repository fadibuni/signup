<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <div id="left-side">
        <div id="odin">
          <img src="images/odin-lined.png" alt="Odin" />
          <span>ODIN</span>
        </div>
        <span>Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></span>
      </div>
      <div id="right-side">
        <div id="upper-right" class="padding">
          <p>
            The is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sing up
            now and get started
          </p>
          <p>You know you want to.</p>
        </div>
        <div id="middle-right" class="padding">
          <h2>Let's do this!</h2>
          <form action="" id="form">
            <div>
              <label for="fname">FIRST NAME</label><br/>
              <input type="text" id="fname" required/>
            </div>
            <div>
              <label for="lname">LAST NAME</label><br/>
              <input type="text" id="lname" required/>
            </div>
            <div>
              <label for="email">EMAIL</label><br/>
              <input type="email" id="email" required/>
            </div>
            <div>
              <label for="phone">PHONE NUMBER</label><br/>
              <input type="tel" id="phone" required/>
            </div>
            <div>
              <label for="password">PASSWORD</label><br/>
              <input type="password" id="password" required/>
            </div>
            <div>
              <label for="cpassword">CONFIRM PASSWORD</label><br/>
              <input type="password" id="cpassword" required/>
            </div>
          </form>
        </div>

        <div id="bottom-right" class="padding">
          <button form="form" type="submit">Create Account</button>
          <p>Alredy have an account? <a href="">Log in</a></p>
        </div>
      </div>
    </main>
  </body>
</html>
